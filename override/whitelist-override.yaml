  # ── L4 · GFW-blocked + popular foreign sites → Proxy ───────────────────────────
  #    ForeignDomain = 666OS Proxy.mrs: GFWList + popular foreign services (Google,
  #    YouTube, X, Instagram, Reddit, GitHub, OpenAI/AI, Netflix, …) in one set.
  #    GEOSITE,gfw adds meta-rules-dat's gfw coverage on top.
  - "RULE-SET,ForeignDomain,🌏 Proxy"
  - "GEOSITE,gfw,🌏 Proxy"
  - "RULE-SET,ForeignIP,🌏 Proxy,no-resolve"
  # Optional per-service split — uncomment the rule-providers you want and route them
  # to their own groups. Same upstream, same *.mrs style:
  #   AI:         {type: http, behavior: domain, format: mrs, interval: 86400,
  #                url: https://github.com/666OS/rules/raw/release/mihomo/domain/OpenAI.mrs}
  #   GitHubSet:  {…/domain/GitHub.mrs}   YouTube: {…/domain/YouTube.mrs}
  #   Telegram:   {…/domain/Telegram.mrs} Netflix: {…/domain/Netflix.mrs}
  # and add `- "RULE-SET,AI,🌏 Proxy"` style rules in L4 above.

  # ── L5 · China mainland + known-direct → built-in DIRECT ───────────────────────
  - RULE-SET,ChinaDomain,DIRECT
  - RULE-SET,KnownDirect,DIRECT
  - GEOSITE,cn,DIRECT
  - RULE-SET,ChinaIP,DIRECT,no-resolve
  - GEOIP,CN,DIRECT

  # ── L5b · optional hybrid: proxy every non-CN IP that survived the ladder ─────────
  #    Closes the hole for IP-only endpoints that CN cannot reach. Costs you the strict
  #    "whitelist" semantics, so it ships disabled.
  # - "NOT,((GEOIP,CN)),🌏 Proxy"

  # ── L6 · whitelist tail — everything unmatched bypasses ───────────────────────────
  - "MATCH,🐟 Final"
